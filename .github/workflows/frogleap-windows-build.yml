name: Frogleap Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, name: x64 }
          - { target: aarch64-pc-windows-msvc, name: arm64 }
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies and mihomo sidecar
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: frogleap-clash-verge-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
