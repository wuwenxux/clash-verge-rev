<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 117 27">
  <defs>
    <linearGradient id="frogleap-wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#22C55E"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .frogleap-word {
      animation: frogleap-hop 2.8s ease-in-out infinite;
    }
    @keyframes frogleap-hop {
      0%, 100% { transform: translateY(0); }
      10% { transform: translateY(-2px); }
      20% { transform: translateY(0); }
      26% { transform: translateY(-0.8px); }
      33% { transform: translateY(0); }
    }
  </style>
  <text class="frogleap-word" x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="url(#frogleap-wordmark)">Frogleap</text>
</svg>
